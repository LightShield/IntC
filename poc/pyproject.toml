[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intentc"
version = "0.1.0"
description = "IntC: C prototype of IntentCompile"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "z3-solver>=4.12.0",      # SMT solving: contract checks, CEGIS hole synthesis
    "tree-sitter>=0.22.0",    # C/C++ parsing and source-span rewriting
    "tree-sitter-cpp>=0.23.0",
    "pydantic>=2.0",          # contract schema validation
    "pyyaml>=6.0",            # contract files
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.scripts]
intentc = "intentc.main:main"

[tool.setuptools.packages.find]
include = ["intentc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
