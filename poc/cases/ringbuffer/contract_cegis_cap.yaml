name: ringbuffer-cegis-cap-1
baseline: baseline.c
parameters:
  - name: CAPACITY
    bits: 64
    constraints: ["CAPACITY >= 1000", "CAPACITY <= 1048576"]
harnesses:
  - file: harness_floor.c
    entry: harness
    unwind: 1
    note: Same Post floor as contract_cegis_skip.yaml. Cap 1 stops after the 1024 cex.
  - file: harness_fifo.c
    entry: harness
    unwind: 8
    defines: {K: "4"}
budget: {}
verify_timeout_s: 120
cegis_max_tries: 1
